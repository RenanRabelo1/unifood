spring.application.name=produtos-service
server.port=${PORT:8082}

# Banco próprio do serviço: MongoDB produtos_db
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/produtos_db}
spring.data.mongodb.database=produtos_db
spring.data.mongodb.auto-index-creation=true

# Microserviço de Usuários (validação de token)
usuarios.url=${USUARIOS_URL:http://localhost:8081}

cors.origens=${CORS_ORIGENS:*}
