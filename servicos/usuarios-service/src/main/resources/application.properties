spring.application.name=usuarios-service
server.port=${PORT:8081}

# Banco próprio do serviço: MongoDB usuarios_db
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/usuarios_db}
spring.data.mongodb.database=usuarios_db
spring.data.mongodb.auto-index-creation=true

jwt.segredo=${JWT_SECRET:unifood-segredo-de-desenvolvimento-troque-em-producao-123456}
jwt.expiracao-horas=${JWT_EXPIRACAO_HORAS:12}

cors.origens=${CORS_ORIGENS:*}
